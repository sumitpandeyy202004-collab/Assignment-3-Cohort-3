<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" />
</head>

<body>
    <header>
        <nav>
            <img src="./squidGame-logo.png" alt="Logo-Not-Found">

            <div class="links-container">
                <a href="#">About</a>
                <a href="#">Watch now</a>
                <a href="#">Actors</a>
                <a href="#">Contact</a>
            </div>

            <i class="fa-solid fa-bars"></i>
        </nav>
    </header>

    <main>
        <section class="section-first">
            <div class="left-content">
                <img src="./squidGame-logo.png" alt="Squid-Game-Logo">

                <p>Action/Thriller/Drama Series directed by Dong-hyuk Hwang Season 1: 9 Episodes</p>

                <div class="btn-container">
                    <button class="btn-first">
                        <i class="fa-solid fa-circle-play"></i>
                        Play Now
                    </button>

                    <button class="btn-second">
                        <i class="fa-solid fa-play"></i>
                        Watch Trailer
                    </button>
                </div>

                <h3>GAME</h3>
            </div>

            <div class="smallScrollText">
                <hr>
                <p>SCROLL</p>
            </div>

            <img src="./mask-man-image.png" class="maskman-image" alt="MaskMan-Png">

            <aside>
                <div class="Media-Links">
                    <i class="fa-brands fa-twitter"></i>
                    <i class="fa-brands fa-instagram"></i>
                    <i class="fa-brands fa-facebook-f"></i>
                </div>

                <h2>SQUID</h2>
            </aside>
        </section>

        <section class="section-second">
            <div class="final-image-container">
                <div class="image-first">
                    <img src="./first-final-image.png" alt="Final-Image-First">
                    <i class="fa-solid fa-circle-play"></i>
                </div>

                <div class="image-second">
                    <img src="./second-final-image.png" alt="Final-Image-Second">
                    <i class="fa-solid fa-circle-play"></i>
                </div>

                <div class="image-fourth">
                    <img src="./third-final-image.png" alt="Final-Image-First">
                    <i class="fa-solid fa-circle-play"></i>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
